<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Board dự án</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1b1f24;
        --muted: #5f6b7a;
        --line: #dfe3e8;
        --accent: #2457d6;
        --ok: #1f7a3d;
        --warn: #a15c00;
        --bad: #b42318;
        --chip: #eef1f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --panel: #1a1f25;
          --text: #e6e9ed;
          --muted: #9aa5b1;
          --line: #2c333b;
          --accent: #7aa2ff;
          --ok: #5cc98a;
          --warn: #f0b45a;
          --bad: #ff8a80;
          --chip: #252c34;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        background: var(--bg);
        max-width: 100%;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--bg);
      }
      .tabs {
        display: none;
        gap: 6px;
        overflow-x: auto;
        padding: 10px 16px 0;
      }
      .tabs button {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tabs button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(190px, 1fr);
        gap: 12px;
        padding: 16px;
        overflow-x: auto;
        align-items: start;
      }
      .column h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
        display: flex;
        justify-content: space-between;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card .title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        align-items: center;
      }
      .chip {
        background: var(--chip);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .chip.gate {
        color: var(--warn);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 4px;
      }
      .dot.success {
        background: var(--ok);
      }
      .dot.failure {
        background: var(--bad);
      }
      .dot.pending {
        background: var(--warn);
      }
      a {
        color: var(--accent);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        padding: 0;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.4);
      }
      .sheet {
        padding: 16px;
      }
      .sheet h3 {
        margin: 0 0 8px;
      }
      .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border-radius: 8px;
        padding: 10px;
        max-height: 40vh;
        overflow: auto;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .body img {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 8px 0;
        border-radius: 6px;
      }
      .attach {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .attach input {
        display: none;
      }
      .attach label {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text);
      }
      .previews {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .previews img {
        height: 72px;
        max-width: 160px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--line);
      }
      .chat {
        display: grid;
        gap: 8px;
      }
      .chat-log {
        display: grid;
        gap: 6px;
        max-height: 45vh;
        overflow-y: auto;
        padding: 2px;
      }
      .chat-log > * {
        min-width: 0;
      }
      .chat-log .message .text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .request {
        border: 1px solid var(--warn, #c08a00);
        border-radius: 10px;
        padding: 10px 12px;
        display: grid;
        gap: 6px;
      }
      .request button[aria-pressed="true"] {
        border-color: var(--accent, currentColor);
        outline: 2px solid var(--accent, currentColor);
      }
      .request pre,
      .resume code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        font-size: 13px;
      }
      .resume {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .chip.agent-waiting-owner,
      .chip.agent-request {
        background: var(--warn, #c08a00);
        color: #fff;
      }
      .session {
        display: grid;
        gap: 8px;
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
      }
      .session > * {
        min-width: 0;
      }
      .message {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .message.user {
        background: var(--chip);
      }
      .message .meta {
        margin-bottom: 4px;
      }
      .text,
      .step pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
      }
      .step {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .step summary {
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .step.failed summary {
        color: var(--bad);
      }
      .step pre {
        background: var(--bg);
        border-radius: 6px;
        padding: 8px;
        margin-top: 6px;
        max-height: 60vh;
        overflow: auto;
      }
      .step .text {
        margin-top: 6px;
      }
      .error {
        color: var(--bad);
        min-height: 1.2em;
      }
      .login {
        max-width: 360px;
        margin: 15vh auto;
        padding: 0 16px;
      }
      .login form {
        display: grid;
        gap: 10px;
      }
      @media (max-width: 720px) {
        .tabs {
          display: flex;
        }
        .board {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          overflow-x: visible;
        }
        .column:not(.active) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const app = document.getElementById("app");
      const state = { data: null, active: "plan" };
      const checkText = {
        success: "CI đạt",
        failure: "CI lỗi",
        pending: "CI đang chạy",
        none: "chưa có CI",
        unknown: "CI ?",
      };

      function el(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === "class") node.className = value;
          else if (key.startsWith("on"))
            node.addEventListener(key.slice(2), value);
          else if (value !== undefined && value !== null)
            node.setAttribute(key, value);
        }
        for (const child of children.flat())
          if (child !== null && child !== undefined && child !== false)
            node.append(child instanceof Node ? child : String(child));
        return node;
      }

      async function call(path, body) {
        const response = await fetch(path, {
          method: body ? "POST" : "GET",
          headers: body
            ? { "Content-Type": "application/json", "X-Board": "1" }
            : {},
          body: body ? JSON.stringify(body) : undefined,
          credentials: "same-origin",
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401 && path !== "/api/login") {
          showLogin();
          throw new Error("Cần đăng nhập");
        }
        if (!response.ok)
          throw new Error(data.error || `Lỗi ${response.status}`);
        return data;
      }

      function showLogin(message = "") {
        const error = el("div", { class: "error" }, message);
        const input = el("input", {
          type: "password",
          autocomplete: "current-password",
          placeholder: "Mật khẩu",
          required: "",
        });
        const form = el(
          "form",
          {
            onsubmit: async (event) => {
              event.preventDefault();
              try {
                await call("/api/login", { password: input.value });
                start();
              } catch (e) {
                error.textContent = e.message;
              }
            },
          },
          el("h1", {}, "Board dự án"),
          input,
          el("button", { class: "primary", type: "submit" }, "Đăng nhập"),
          error,
        );
        app.replaceChildren(el("div", { class: "login" }, form));
        input.focus();
      }

      const safeUrl = (url) =>
        typeof url === "string" && url.startsWith("https://") ? url : null;

      const maxImageBytes = 5 * 1024 * 1024;
      const boardImage =
        /!\[([^\]]*)\]\(https:\/\/github\.com\/[^/\s)]+\/[^/\s)]+\/blob\/board-images\/images\/(\d{4}-\d{2}\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\?raw=true\)/g;

      // Text with the board's own images shown in place. They load through the
      // board, because the browser has no GitHub login for a private repository.
      function withImages(text) {
        const parts = [];
        let last = 0;
        for (const match of text.matchAll(boardImage)) {
          parts.push(text.slice(last, match.index));
          parts.push(
            el("img", {
              src: `/api/images/${match[2]}`,
              alt: match[1],
              loading: "lazy",
            }),
          );
          last = match.index + match[0].length;
        }
        parts.push(text.slice(last));
        return parts;
      }

      // Adds choosing, pasting and dropping images to a textarea. Each image is
      // uploaded at once and its Markdown goes in at the cursor.
      function imagePicker(textarea, error) {
        const status = el(
          "span",
          {},
          "Dán, kéo thả hoặc chọn ảnh, tối đa 5 MB",
        );
        const previews = el("div", { class: "previews" });
        let pending = 0;
        const insert = (markdown) => {
          const start = textarea.selectionStart;
          const before = textarea.value.slice(0, start);
          const after = textarea.value.slice(textarea.selectionEnd);
          const lead = before && !before.endsWith("\n") ? "\n" : "";
          const inserted = `${lead}${markdown}\n`;
          textarea.value = before + inserted + after;
          textarea.selectionEnd = textarea.selectionStart =
            before.length + inserted.length;
        };
        const read = (file) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1]);
            reader.onerror = () => reject(new Error("Không đọc được ảnh"));
            reader.readAsDataURL(file);
          });
        const upload = async (file) => {
          if (file.size > maxImageBytes) {
            error.textContent = `${file.name}: ảnh tối đa 5 MB`;
            return;
          }
          pending += 1;
          status.textContent = "Đang tải ảnh…";
          try {
            const image = await call("/api/images", {
              name: file.name,
              data: await read(file),
            });
            insert(image.markdown);
            previews.append(
              el("img", { src: `/api/images/${image.id}`, alt: file.name }),
            );
            error.textContent = "";
          } catch (e) {
            error.textContent = e.message;
          }
          pending -= 1;
          if (!pending) status.textContent = "Đã thêm ảnh vào nội dung";
        };
        const images = (list) =>
          [...list].filter((file) => file.type.startsWith("image/"));
        const uploadAll = (list) => images(list).forEach(upload);
        const input = el("input", {
          type: "file",
          accept: "image/png,image/jpeg,image/gif,image/webp",
          multiple: "",
          onchange: () => {
            uploadAll(input.files);
            input.value = "";
          },
        });
        textarea.addEventListener("paste", (event) => {
          const pasted = images(event.clipboardData?.files ?? []);
          if (!pasted.length) return;
          event.preventDefault();
          pasted.forEach(upload);
        });
        textarea.addEventListener("dragover", (event) =>
          event.preventDefault(),
        );
        textarea.addEventListener("drop", (event) => {
          if (!images(event.dataTransfer?.files ?? []).length) return;
          event.preventDefault();
          uploadAll(event.dataTransfer.files);
        });
        return {
          busy: () => pending > 0,
          node: el(
            "div",
            {},
            el(
              "div",
              { class: "attach" },
              el("label", {}, "Thêm ảnh", input),
              status,
            ),
            previews,
          ),
        };
      }
      const when = (iso) =>
        iso
          ? new Date(iso).toLocaleString("vi-VN", {
              dateStyle: "short",
              timeStyle: "short",
            })
          : "";

      function card(feature, column) {
        const pull = feature.pull;
        return el(
          "div",
          {
            class: "card",
            tabindex: "0",
            onclick: () => openFeature(feature, column),
            onkeydown: (e) => e.key === "Enter" && openFeature(feature, column),
          },
          el("div", { class: "title" }, `#${feature.number} ${feature.title}`),
          el(
            "div",
            { class: "meta" },
            column.gate && feature.stage !== "done"
              ? el("span", { class: "chip gate" }, `Chờ ${column.gate}`)
              : null,
            feature.priority
              ? el("span", { class: "chip" }, feature.priority.toUpperCase())
              : null,
            agentChip(feature),
            pull
              ? el(
                  "span",
                  {},
                  pull.checks
                    ? el("span", { class: `dot ${pull.checks}` })
                    : null,
                  `PR #${pull.number}`,
                )
              : null,
            pull?.preview ? el("span", {}, "có preview") : null,
            el("span", {}, when(feature.updated)),
          ),
        );
      }

      function render() {
        const { data } = state;
        const byColumn = Object.fromEntries(
          data.columns.map((c) => [c.id, []]),
        );
        for (const feature of data.features)
          byColumn[feature.stage]?.push(feature);
        const order = { now: 0, next: 1, later: 2 };
        for (const list of Object.values(byColumn))
          list.sort(
            (a, b) =>
              (order[a.priority] ?? 3) - (order[b.priority] ?? 3) ||
              String(b.updated).localeCompare(String(a.updated)),
          );
        const tabs = el(
          "nav",
          { class: "tabs" },
          data.columns.map((column) =>
            el(
              "button",
              {
                "aria-pressed": String(column.id === state.active),
                onclick: () => {
                  state.active = column.id;
                  render();
                },
              },
              `${column.title} ${byColumn[column.id].length}`,
            ),
          ),
        );
        const board = el(
          "main",
          { class: "board" },
          data.columns.map((column) =>
            el(
              "section",
              { class: `column${column.id === state.active ? " active" : ""}` },
              el(
                "h2",
                {},
                el("span", {}, column.title),
                el("span", {}, byColumn[column.id].length),
              ),
              byColumn[column.id].map((feature) => card(feature, column)),
            ),
          ),
        );
        const header = el(
          "header",
          {},
          el("h1", {}, data.project),
          el("button", { onclick: newIdea }, "+ Ý tưởng"),
          el("button", { onclick: () => load(true), title: "Tải lại" }, "↻"),
        );
        app.replaceChildren(header, tabs, board);
      }

      const buttons = {
        idea: [
          ["approve", "Duyệt G1: lập kế hoạch", "primary"],
          ["revise", "Sửa lại"],
          ["stop", "Dừng", "danger"],
        ],
        plan: [
          ["approve", "Duyệt G2: cho làm", "primary"],
          ["revise", "Sửa lại"],
          ["stop", "Dừng", "danger"],
        ],
        ready: [["stop", "Tạm dừng", "danger"]],
        running: [["stop", "Tạm dừng agent", "danger"]],
        review: [
          ["approve", "Duyệt và merge PR", "primary"],
          ["revise", "Yêu cầu sửa"],
          ["stop", "Dừng", "danger"],
        ],
        blocked: [
          ["approve", "Gỡ chặn, làm tiếp", "primary"],
          ["revise", "Gỡ chặn kèm ghi chú"],
          ["stop", "Dừng", "danger"],
        ],
        done: [],
      };

      const agentStatus = {
        new: "Chưa có phiên",
        running: "Claude đang làm",
        idle: "Claude rảnh",
        "waiting-owner": "Claude chờ bạn",
        "taken-over": "Bạn đang tiếp quản",
        reassigned: "Đã chuyển sang agent khác",
        failed: "Lượt cuối bị lỗi",
      };

      // Named agents: each Claude orchestrator that can take features.
      const namedAgents = () => state.data.agent?.agents ?? [];
      // A feature with no agent waits, unless an unnamed agent takes those.
      const needsAgent = (feature) =>
        namedAgents().length > 0 &&
        !feature.agent &&
        !state.data.agent?.unnamed &&
        feature.stage !== "done";

      function agentChip(feature) {
        const chips = [];
        if (feature.agent)
          chips.push(el("span", { class: "chip" }, `Agent: ${feature.agent}`));
        else if (needsAgent(feature))
          chips.push(
            el("span", { class: "chip agent-request" }, "Chưa giao agent"),
          );
        const info = state.data.agent?.features?.[feature.number];
        // Ignore what an agent that lost the feature last said.
        if (info && (info.agent || null) === (feature.agent || null))
          chips.push(
            info.requests
              ? el(
                  "span",
                  { class: "chip agent-request" },
                  "Claude cần bạn duyệt",
                )
              : el(
                  "span",
                  { class: `chip agent-${info.status}` },
                  agentStatus[info.status] ?? info.status,
                ),
          );
        return chips;
      }

      // Pick which agent works on a feature.
      function agentPicker(feature, hasSession, onChange) {
        const agents = namedAgents();
        if (!agents.length) return null;
        const error = el("div", { class: "error" });
        const select = el(
          "select",
          { "aria-label": "Agent" },
          el("option", { value: "" }, "— Chọn agent —"),
          agents.map((a) =>
            el(
              "option",
              { value: a.name },
              `${a.name}${a.online ? "" : " (mất kết nối)"}`,
            ),
          ),
        );
        select.value = feature.agent ?? "";
        const button = el("button", {}, feature.agent ? "Đổi agent" : "Giao");
        button.addEventListener("click", async () => {
          const agent = select.value;
          if (!agent || agent === feature.agent) return;
          if (
            feature.agent &&
            !confirm(
              hasSession()
                ? `Chuyển sang ${agent}? Phiên Claude hiện tại nằm trên máy ${feature.agent}; ${agent} sẽ bắt đầu phiên mới và đọc lại issue cùng Agent Workpad.`
                : `Chuyển feature sang ${agent}?`,
            )
          )
            return;
          button.disabled = true;
          error.textContent = "";
          try {
            await call(`/api/features/${feature.number}/agent`, { agent });
            feature.agent = agent;
            button.textContent = "Đổi agent";
            onChange?.();
            load(true);
          } catch (e) {
            error.textContent = e.message;
          }
          button.disabled = false;
        });
        return el(
          "div",
          { class: "resume" },
          el("span", {}, "Agent:"),
          select,
          button,
          error,
        );
      }

      const quote = (path) => `'${String(path).replaceAll("'", "'\\''")}'`;
      const resumeCommand = (s) =>
        s.host === "dokploy"
          ? `docker exec -it <container> sh -lc "cd ${quote(s.workspace)} && claude --resume ${s.sessionId}"`
          : `cd ${quote(s.workspace)} && claude --resume ${s.sessionId}`;

      // The feature's Claude session: live log, owner's questions and approvals,
      // a message box, and the command to continue it in a terminal.
      function chatPanel(feature) {
        const number = feature.number;
        const path = `/api/features/${number}/chat`;
        let after = 0;
        let timer = null;
        let latest = null;
        let shownRequests = "";
        const answered = new Set();
        const log = el("div", { class: "chat-log", "aria-live": "polite" });
        const head = el("p", { class: "meta" });
        const resume = el("div", { class: "resume" });
        const requests = el("div", { class: "chat" });
        const error = el("div", { class: "error" });
        const input = el("textarea", {
          rows: "3",
          placeholder: "Nhắn cho Claude về feature này (Ctrl+Enter để gửi)",
        });
        const sendButton = el("button", { class: "primary" }, "Gửi");
        const takeButton = el("button", {}, "Tiếp quản trong terminal");

        const post = async (suffix, body) => {
          error.textContent = "";
          try {
            await call(`${path}${suffix}`, body);
            refresh();
          } catch (e) {
            error.textContent = e.message;
          }
        };
        const send = async () => {
          const text = input.value.trim();
          if (!text) return;
          sendButton.disabled = true;
          await post("", { text });
          input.value = "";
          sendButton.disabled = false;
        };
        sendButton.addEventListener("click", send);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
        });
        takeButton.addEventListener("click", () => {
          if (latest?.status === "taken-over") return post("/release", {});
          if (
            confirm(
              "Dừng lượt đang chạy và để bạn tự tiếp tục phiên này trong terminal?",
            )
          )
            post("/takeover", {});
        });

        function entry(event) {
          if (event.kind === "owner")
            return el(
              "div",
              { class: "message user" },
              el("div", { class: "meta" }, `Bạn · ${when(event.at)}`),
              el("div", { class: "text" }, event.text),
            );
          if (event.kind === "assistant")
            return el(
              "div",
              { class: "message" },
              el("div", { class: "meta" }, `Claude · ${when(event.at)}`),
              el("div", { class: "text" }, event.text),
            );
          if (event.kind === "tool")
            return el(
              "div",
              { class: "step" },
              `${event.name} · ${event.summary}`,
            );
          if (event.kind === "request")
            return el(
              "div",
              { class: "step" },
              event.requestKind === "question"
                ? "Claude hỏi bạn"
                : `Xin duyệt: ${event.reason}`,
            );
          if (event.kind === "request-closed")
            return el(
              "div",
              { class: "step" },
              `Đã xử lý yêu cầu (${event.outcome})`,
            );
          if (event.kind === "result")
            return el(
              "div",
              { class: `step${event.ok ? "" : " failed"}` },
              `${event.ok ? "Xong lượt" : "Lượt lỗi"} · $${event.costUsd.toFixed(2)}`,
            );
          if (event.kind === "error")
            return el("div", { class: "step failed" }, event.text);
          if (event.kind === "status")
            return el(
              "div",
              { class: "step" },
              agentStatus[event.status] ?? event.status,
            );
          return null;
        }

        function requestCard(request) {
          const note = el("textarea", {
            rows: "2",
            placeholder: "Ghi chú (tuỳ chọn)",
          });
          const done = (body) => {
            answered.add(request.id);
            shownRequests = "";
            post("/answer", { id: request.id, ...body, note: note.value });
          };
          if (request.kind === "approval")
            return el(
              "div",
              { class: "request" },
              el("strong", {}, `Claude xin duyệt: ${request.reason}`),
              el("pre", {}, request.summary),
              note,
              el(
                "div",
                { class: "actions" },
                el(
                  "button",
                  { class: "primary", onclick: () => done({ allow: true }) },
                  "Cho phép",
                ),
                el(
                  "button",
                  { class: "danger", onclick: () => done({ allow: false }) },
                  "Từ chối",
                ),
              ),
            );
          const picks = (request.questions ?? []).map((q) => {
            const free = el("input", { placeholder: "Hoặc tự trả lời" });
            const chosen = new Set();
            const options = q.options.map((o) => {
              const button = el("button", { title: o.description }, o.label);
              button.addEventListener("click", () => {
                if (!q.multiSelect) chosen.clear();
                chosen.has(o.label)
                  ? chosen.delete(o.label)
                  : chosen.add(o.label);
                for (const b of options)
                  b.setAttribute(
                    "aria-pressed",
                    String(chosen.has(b.textContent)),
                  );
              });
              return button;
            });
            return {
              q,
              value: () => free.value.trim() || [...chosen].join(", "),
              node: el(
                "div",
                {},
                el("p", {}, q.question),
                el("div", { class: "actions" }, options),
                free,
              ),
            };
          });
          return el(
            "div",
            { class: "request" },
            el("strong", {}, "Claude hỏi bạn"),
            picks.map((p) => p.node),
            note,
            el(
              "div",
              { class: "actions" },
              el(
                "button",
                {
                  class: "primary",
                  onclick: () =>
                    done({
                      allow: true,
                      answers: Object.fromEntries(
                        picks.map((p) => [p.q.question, p.value()]),
                      ),
                    }),
                },
                "Trả lời",
              ),
              el("button", { onclick: () => done({ allow: false }) }, "Bỏ qua"),
            ),
          );
        }

        function show(view) {
          latest = view.state;
          const s = view.state;
          head.replaceChildren(
            ...[
              el(
                "span",
                { class: "chip" },
                view.online
                  ? "Orchestrator đang chạy"
                  : "Orchestrator mất kết nối",
              ),
              s
                ? el(
                    "span",
                    { class: `chip agent-${s.status}` },
                    agentStatus[s.status] ?? s.status,
                  )
                : el("span", {}, "Chưa có phiên Claude"),
              s?.queued ? el("span", {}, `${s.queued} tin chờ`) : null,
              s
                ? el("span", {}, `${s.turns} lượt · $${s.costUsd.toFixed(2)}`)
                : null,
              s
                ? el(
                    "span",
                    {},
                    `${s.agent ? `${s.agent} · ` : ""}${s.host === "dokploy" ? "Dokploy" : "Mac"}`,
                  )
                : null,
            ].filter(Boolean),
          );
          takeButton.textContent =
            s?.status === "taken-over"
              ? "Trả lại cho orchestrator"
              : "Tiếp quản trong terminal";
          takeButton.disabled = !s?.sessionId;
          resume.replaceChildren(
            ...(s?.sessionId && s.workspace
              ? [
                  el("code", {}, resumeCommand(s)),
                  el(
                    "button",
                    {
                      onclick: () =>
                        navigator.clipboard?.writeText(resumeCommand(s)),
                    },
                    "Chép lệnh",
                  ),
                ]
              : []),
          );
          // Redraw only when the open requests change, so a half-written
          // answer survives the next refresh.
          const open = (s?.requests ?? []).filter((r) => !answered.has(r.id));
          const key = JSON.stringify([
            open.map((r) => r.id),
            s?.status === "waiting-owner" ? s.question : null,
          ]);
          if (key !== shownRequests) {
            shownRequests = key;
            requests.replaceChildren(
              ...[
                ...open.map(requestCard),
                s?.status === "waiting-owner" && s.question
                  ? el(
                      "div",
                      { class: "request" },
                      el("strong", {}, "Claude đang chờ bạn trả lời"),
                      el("pre", {}, s.question),
                    )
                  : null,
              ].filter(Boolean),
            );
          }
          const stick =
            log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
          for (const event of view.events) {
            const node = entry(event);
            if (node) log.append(node);
          }
          if (view.events.length) after = view.events.at(-1).seq;
          if (stick) log.scrollTop = log.scrollHeight;
        }

        async function refresh() {
          clearTimeout(timer);
          try {
            show(await call(`${path}?after=${after}`));
          } catch (e) {
            error.textContent = e.message;
          }
          if (node.isConnected) timer = setTimeout(refresh, 2000);
        }

        const hint = el(
          "p",
          { class: "meta" },
          "Giao feature cho một agent để Claude bắt đầu làm và nhận tin nhắn.",
        );
        hint.hidden = !needsAgent(feature);
        const node = el(
          "div",
          { class: "chat" },
          el("h4", {}, "Phiên Claude"),
          agentPicker(
            feature,
            () => Boolean(latest?.sessionId),
            () => {
              hint.hidden = !needsAgent(feature);
              refresh();
            },
          ),
          hint,
          head,
          log,
          requests,
          input,
          el("div", { class: "actions" }, sendButton, takeButton),
          resume,
          error,
        );
        return { node, start: refresh, stop: () => clearTimeout(timer) };
      }

      function openFeature(feature, column) {
        const dialog = el("dialog");
        const error = el("div", { class: "error" });
        const note = el("textarea", {
          rows: "3",
          placeholder: "Ghi chú cho agent (bắt buộc khi Sửa lại)",
        });
        const notePicker = imagePicker(note, error);
        const workpad = el("div", { class: "body" }, "Đang tải bình luận…");
        const sessions = el("p", { class: "meta" });
        const chat = state.data.agent ? chatPanel(feature) : null;
        const pull = feature.pull;
        const act = async (action, label, button) => {
          if (notePicker.busy()) {
            error.textContent = "Đợi ảnh tải xong";
            return;
          }
          if (
            action === "approve" &&
            feature.stage === "review" &&
            !confirm(`Merge PR #${pull?.number ?? "?"} vào nhánh chính?`)
          )
            return;
          button.disabled = true;
          error.textContent = "";
          try {
            await call(`/api/features/${feature.number}/actions`, {
              action,
              note: note.value,
            });
            dialog.close();
            load(true);
          } catch (e) {
            error.textContent = e.message;
            button.disabled = false;
          }
        };
        const actionButtons = (buttons[feature.stage] ?? []).map(
          ([action, label, kind]) => {
            const button = el("button", { class: kind ?? "" }, label);
            button.addEventListener("click", () => act(action, label, button));
            return button;
          },
        );
        dialog.append(
          el(
            "div",
            { class: "sheet" },
            el("h3", {}, `#${feature.number} ${feature.title}`),
            el(
              "div",
              { class: "meta" },
              el("span", { class: "chip" }, column.title),
              ...feature.labels.map((label) =>
                el("span", { class: "chip" }, label),
              ),
              el(
                "a",
                {
                  href: safeUrl(feature.url),
                  target: "_blank",
                  rel: "noopener",
                },
                "Mở trên GitHub",
              ),
            ),
            pull
              ? el(
                  "p",
                  { class: "meta" },
                  el(
                    "a",
                    {
                      href: safeUrl(pull.url),
                      target: "_blank",
                      rel: "noopener",
                    },
                    `PR #${pull.number}`,
                  ),
                  pull.state === "merged"
                    ? "đã merge"
                    : pull.draft
                      ? "nháp"
                      : null,
                  pull.checks
                    ? el(
                        "span",
                        {},
                        el("span", { class: `dot ${pull.checks}` }),
                        checkText[pull.checks] ?? pull.checks,
                      )
                    : null,
                  safeUrl(pull.preview)
                    ? el(
                        "a",
                        {
                          href: safeUrl(pull.preview),
                          target: "_blank",
                          rel: "noopener",
                        },
                        "Xem preview",
                      )
                    : null,
                )
              : null,
            el("h4", {}, "Mô tả và kế hoạch"),
            el("div", { class: "body" }, withImages(feature.body || "(trống)")),
            el("h4", {}, "Agent Workpad"),
            workpad,
            sessions,
            chat?.node,
            actionButtons.length ? el("h4", {}, "Quyết định") : null,
            actionButtons.length ? note : null,
            actionButtons.length ? notePicker.node : null,
            el(
              "div",
              { class: "actions" },
              actionButtons,
              el("button", { onclick: () => dialog.close() }, "Đóng"),
            ),
            error,
          ),
        );
        dialog.addEventListener("close", () => {
          chat?.stop();
          dialog.remove();
        });
        document.body.append(dialog);
        dialog.showModal();
        chat?.start();
        call(`/api/features/${feature.number}/comments`)
          .then((comments) => {
            const pad = comments.filter((c) => c.workpad).pop();
            workpad.replaceChildren(
              ...withImages(pad ? pad.body : "(agent chưa ghi workpad)"),
            );
            const runs = comments.flatMap((c) =>
              [...c.body.matchAll(/#session\/(\d+)/g)].map((m) => m[1]),
            );
            sessions.replaceChildren(
              ...[...new Set(runs)].map((run, index) =>
                el(
                  "a",
                  {
                    href: `#session/${run}`,
                    target: "_blank",
                    rel: "noopener",
                  },
                  `Phiên Claude ${index + 1}`,
                ),
              ),
            );
          })
          .catch((e) => (workpad.textContent = e.message));
      }

      function newIdea() {
        const dialog = el("dialog");
        const title = el("input", {
          placeholder: "Tên ý tưởng",
          maxlength: "200",
        });
        const body = el("textarea", {
          rows: "6",
          placeholder: "Mô tả ngắn: vấn đề, ai dùng, kết quả mong muốn",
        });
        const error = el("div", { class: "error" });
        const picker = imagePicker(body, error);
        const save = el("button", { class: "primary" }, "Tạo");
        save.addEventListener("click", async () => {
          if (picker.busy()) {
            error.textContent = "Đợi ảnh tải xong";
            return;
          }
          save.disabled = true;
          try {
            await call("/api/features", {
              title: title.value,
              body: body.value,
            });
            dialog.close();
            load(true);
          } catch (e) {
            error.textContent = e.message;
            save.disabled = false;
          }
        });
        dialog.append(
          el(
            "div",
            { class: "sheet" },
            el("h3", {}, "Ý tưởng mới"),
            title,
            el("p"),
            body,
            picker.node,
            el(
              "div",
              { class: "actions" },
              save,
              el("button", { onclick: () => dialog.close() }, "Huỷ"),
            ),
            error,
          ),
        );
        dialog.addEventListener("close", () => dialog.remove());
        document.body.append(dialog);
        dialog.showModal();
        title.focus();
      }

      async function load(fresh = false) {
        try {
          state.data = await call(`/api/board${fresh ? "?fresh=1" : ""}`);
          document.title = `Board · ${state.data.project}`;
          render();
        } catch (e) {
          if (e.message !== "Cần đăng nhập")
            app.replaceChildren(
              el("p", { class: "error", style: "padding:16px" }, e.message),
            );
        }
      }

      function sessionEntry(entry) {
        if (entry.kind === "user" || entry.kind === "assistant")
          return el(
            "section",
            { class: `message ${entry.kind}` },
            el(
              "div",
              { class: "meta" },
              el("strong", {}, entry.kind === "user" ? "Yêu cầu" : "Claude"),
              when(entry.at),
            ),
            el("div", { class: "text" }, entry.text),
          );
        if (entry.kind === "thinking")
          return el(
            "details",
            { class: "step" },
            el("summary", {}, "Suy nghĩ"),
            el("div", { class: "text" }, entry.text),
          );
        return el(
          "details",
          { class: `step${entry.error ? " failed" : ""}` },
          el(
            "summary",
            {},
            el("strong", {}, entry.name || "Kết quả"),
            ` ${entry.summary}`,
          ),
          entry.input ? el("pre", {}, entry.input) : null,
          el("pre", {}, entry.result ?? "(không có kết quả)"),
        );
      }

      async function showSession(run) {
        app.replaceChildren(el("p", { style: "padding:16px" }, "Đang tải…"));
        try {
          const session = await call(`/api/sessions/${run}`);
          document.title = `Phiên Claude · ${session.project}`;
          app.replaceChildren(
            el(
              "header",
              {},
              el("a", { href: "#" }, "← Board"),
              el("h1", {}, `Phiên Claude · ${session.project}`),
              el(
                "a",
                {
                  href: safeUrl(
                    `https://github.com/${session.repo}/actions/runs/${run}`,
                  ),
                  target: "_blank",
                  rel: "noopener",
                },
                "Lần chạy",
              ),
            ),
            el(
              "main",
              { class: "session" },
              session.entries.length
                ? session.entries.map(sessionEntry)
                : "(phiên trống)",
            ),
          );
        } catch (e) {
          if (e.message !== "Cần đăng nhập")
            app.replaceChildren(
              el(
                "div",
                { style: "padding:16px" },
                el("p", { class: "error" }, e.message),
                el("a", { href: "#" }, "← Board"),
              ),
            );
        }
      }

      const sessionRun = () => location.hash.match(/^#session\/(\d+)$/)?.[1];

      function start() {
        const run = sessionRun();
        if (run) showSession(run);
        else load();
      }

      window.addEventListener("hashchange", start);
      start();
      setInterval(
        () =>
          document.visibilityState === "visible" &&
          state.data &&
          !sessionRun() &&
          load(),
        60_000,
      );
    </script>
  </body>
</html>
