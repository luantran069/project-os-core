<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Board dự án</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1b1f24;
        --muted: #5f6b7a;
        --line: #dfe3e8;
        --accent: #2457d6;
        --ok: #1f7a3d;
        --warn: #a15c00;
        --bad: #b42318;
        --chip: #eef1f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --panel: #1a1f25;
          --text: #e6e9ed;
          --muted: #9aa5b1;
          --line: #2c333b;
          --accent: #7aa2ff;
          --ok: #5cc98a;
          --warn: #f0b45a;
          --bad: #ff8a80;
          --chip: #252c34;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        background: var(--bg);
        max-width: 100%;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--bg);
      }
      .tabs {
        display: none;
        gap: 6px;
        overflow-x: auto;
        padding: 10px 16px 0;
      }
      .tabs button {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tabs button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(190px, 1fr);
        gap: 12px;
        padding: 16px;
        overflow-x: auto;
        align-items: start;
      }
      .column h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
        display: flex;
        justify-content: space-between;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card .title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        align-items: center;
      }
      .chip {
        background: var(--chip);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .chip.gate {
        color: var(--warn);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 4px;
      }
      .dot.success {
        background: var(--ok);
      }
      .dot.failure {
        background: var(--bad);
      }
      .dot.pending {
        background: var(--warn);
      }
      a {
        color: var(--accent);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        padding: 0;
      }
      dialog.feature {
        width: min(1120px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.4);
      }
      .sheet {
        padding: 16px;
      }
      .sheet h3 {
        margin: 0 0 8px;
      }
      .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border-radius: 8px;
        padding: 10px;
        max-height: 40vh;
        overflow: auto;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .body img {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 8px 0;
        border-radius: 6px;
      }
      .attach {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .attach input {
        display: none;
      }
      .attach label {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text);
      }
      .previews {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .previews img {
        height: 72px;
        max-width: 160px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--line);
      }
      /* The feature's Claude conversation, laid out like a chat app. */
      .convo {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg);
        overflow: hidden;
      }
      .agent-pick {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
      }
      .agent-pick .error,
      .agent-pick .agent-hint {
        flex-basis: 100%;
        margin: 0;
      }
      .agent-pick .agent-hint[hidden] {
        display: none;
      }
      .convo-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .convo-head strong {
        margin-right: 4px;
      }
      .convo-head .meta {
        flex: 1 1 140px;
        min-width: 0;
      }
      .convo-head .meta span,
      .pill {
        white-space: nowrap;
      }
      .convo-head button {
        font-size: 13px;
        padding: 4px 10px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        border-radius: 999px;
        padding: 2px 10px 2px 8px;
        background: var(--chip);
        color: var(--muted);
      }
      .pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .pill[data-state="running"] {
        color: var(--accent);
      }
      .pill[data-state="running"]::before {
        animation: pulse 1.2s ease-in-out infinite;
      }
      .pill[data-state="waiting-owner"],
      .pill[data-state="request"] {
        color: var(--warn);
      }
      .pill[data-state="failed"],
      .pill[data-state="offline"] {
        color: var(--bad);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .transcript {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-height: 62vh;
        min-height: 120px;
        overflow-y: auto;
        padding: 6px 14px 4px;
      }
      .transcript > * {
        min-width: 0;
      }
      .transcript .empty {
        margin: auto;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      .bubble {
        align-self: flex-end;
        max-width: 85%;
        background: var(--chip);
        border-radius: 18px 18px 4px 18px;
        padding: 8px 14px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .reply {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 14px;
        margin-top: 2px;
      }
      .md {
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md pre {
        margin: 0 0 10px;
      }
      .md ul,
      .md ol {
        padding-left: 22px;
      }
      .md li + li {
        margin-top: 2px;
      }
      .md h5 {
        font-size: 15px;
        margin: 12px 0 6px;
      }
      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--chip);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .md pre {
        background: var(--chip);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
        white-space: pre;
      }
      .steps {
        margin-left: 36px;
        font-size: 13px;
        color: var(--muted);
      }
      .steps summary {
        cursor: pointer;
        list-style: none;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .steps summary::-webkit-details-marker {
        display: none;
      }
      .steps summary::before {
        content: "›";
        display: inline-block;
        transition: transform 0.15s;
      }
      .steps[open] summary::before {
        transform: rotate(90deg);
      }
      .steps ol {
        list-style: none;
        margin: 6px 0 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--line);
        display: grid;
        gap: 4px;
      }
      .steps li {
        overflow-wrap: anywhere;
      }
      .steps b {
        color: var(--text);
        font-weight: 600;
        margin-right: 6px;
      }
      .note {
        align-self: center;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .note.failed {
        color: var(--bad);
      }
      .typing {
        margin-left: 36px;
        display: inline-flex;
        gap: 4px;
        padding: 4px 0;
      }
      .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .requests {
        display: grid;
        gap: 8px;
        padding: 0 14px;
      }
      .requests:empty {
        display: none;
      }
      .request {
        border: 1px solid var(--line);
        border-left: 3px solid var(--warn);
        background: var(--panel);
        border-radius: 10px;
        padding: 10px 12px;
        display: grid;
        gap: 8px;
      }
      .request .actions {
        margin-top: 0;
      }
      .request button[aria-pressed="true"] {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
      }
      .request pre,
      .takeover code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .takeover {
        margin: 12px 0 0;
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: grid;
        gap: 8px;
        font-size: 14px;
      }
      .takeover[hidden] {
        display: none;
      }
      .takeover.quiet {
        border-style: solid;
        font-size: 13px;
        color: var(--muted);
        gap: 6px;
        padding: 8px 10px;
      }
      .takeover.quiet code {
        color: var(--text);
        padding: 6px 8px;
      }
      .takeover.quiet button {
        font-size: 13px;
        padding: 3px 10px;
      }
      .takeover code {
        background: var(--chip);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .takeover .actions {
        margin-top: 0;
      }
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin: 0 14px 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 8px 8px 8px 14px;
      }
      .composer:focus-within {
        border-color: var(--accent);
      }
      .composer textarea {
        flex: 1;
        border: 0;
        background: transparent;
        padding: 6px 0;
        resize: none;
        max-height: 200px;
        line-height: 1.45;
        outline: none;
      }
      .composer .send {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        padding: 0;
        display: grid;
        place-items: center;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .composer .send svg {
        width: 18px;
        height: 18px;
      }
      .convo > .error {
        margin: 0 14px 10px;
      }
      .convo > .error:empty {
        display: none;
      }
      .chip.agent-waiting-owner,
      .chip.agent-request {
        background: var(--warn);
        color: #fff;
      }
      .chip.owner-chat {
        background: var(--accent);
        color: #fff;
      }
      /* A feature the owner's chat builds: no orchestrator session to show. */
      .chat-hold {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg);
        overflow: hidden;
      }
      .chat-hold > p {
        margin: 10px 14px;
      }
      .chat-hold > .warning {
        color: var(--warn);
        font-weight: 600;
      }
      .session {
        display: grid;
        gap: 8px;
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
      }
      .session > * {
        min-width: 0;
      }
      .message {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .message.user {
        background: var(--chip);
      }
      .message .meta {
        margin-bottom: 4px;
      }
      .text,
      .step pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
      }
      .step {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .step summary {
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .step.failed summary {
        color: var(--bad);
      }
      .step pre {
        background: var(--bg);
        border-radius: 6px;
        padding: 8px;
        margin-top: 6px;
        max-height: 60vh;
        overflow: auto;
      }
      .step .text {
        margin-top: 6px;
      }
      .error {
        color: var(--bad);
        min-height: 1.2em;
      }
      .login {
        max-width: 360px;
        margin: 15vh auto;
        padding: 0 16px;
      }
      .login form {
        display: grid;
        gap: 10px;
      }
      @media (max-width: 720px) {
        .tabs {
          display: flex;
        }
        .board {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          overflow-x: visible;
        }
        .column:not(.active) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const app = document.getElementById("app");
      const state = { data: null, active: "plan" };
      const checkText = {
        success: "CI đạt",
        failure: "CI lỗi",
        pending: "CI đang chạy",
        none: "chưa có CI",
        unknown: "CI ?",
      };

      function el(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === "class") node.className = value;
          else if (key.startsWith("on"))
            node.addEventListener(key.slice(2), value);
          else if (value !== undefined && value !== null)
            node.setAttribute(key, value);
        }
        for (const child of children.flat())
          if (child !== null && child !== undefined && child !== false)
            node.append(child instanceof Node ? child : String(child));
        return node;
      }

      async function call(path, body) {
        const response = await fetch(path, {
          method: body ? "POST" : "GET",
          headers: body
            ? { "Content-Type": "application/json", "X-Board": "1" }
            : {},
          body: body ? JSON.stringify(body) : undefined,
          credentials: "same-origin",
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401 && path !== "/api/login") {
          showLogin();
          throw new Error("Cần đăng nhập");
        }
        if (!response.ok)
          throw new Error(data.error || `Lỗi ${response.status}`);
        return data;
      }

      function showLogin(message = "") {
        const error = el("div", { class: "error" }, message);
        const input = el("input", {
          type: "password",
          autocomplete: "current-password",
          placeholder: "Mật khẩu",
          required: "",
        });
        const form = el(
          "form",
          {
            onsubmit: async (event) => {
              event.preventDefault();
              try {
                await call("/api/login", { password: input.value });
                start();
              } catch (e) {
                error.textContent = e.message;
              }
            },
          },
          el("h1", {}, "Board dự án"),
          input,
          el("button", { class: "primary", type: "submit" }, "Đăng nhập"),
          error,
        );
        app.replaceChildren(el("div", { class: "login" }, form));
        input.focus();
      }

      const safeUrl = (url) =>
        typeof url === "string" && url.startsWith("https://") ? url : null;

      const maxImageBytes = 5 * 1024 * 1024;
      const boardImage =
        /!\[([^\]]*)\]\(https:\/\/github\.com\/[^/\s)]+\/[^/\s)]+\/blob\/board-images\/images\/(\d{4}-\d{2}\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\?raw=true\)/g;

      // Text with the board's own images shown in place. They load through the
      // board, because the browser has no GitHub login for a private repository.
      function withImages(text) {
        const parts = [];
        let last = 0;
        for (const match of text.matchAll(boardImage)) {
          parts.push(text.slice(last, match.index));
          parts.push(
            el("img", {
              src: `/api/images/${match[2]}`,
              alt: match[1],
              loading: "lazy",
            }),
          );
          last = match.index + match[0].length;
        }
        parts.push(text.slice(last));
        return parts;
      }

      // Adds choosing, pasting and dropping images to a textarea. Each image is
      // uploaded at once and its Markdown goes in at the cursor.
      function imagePicker(textarea, error) {
        const status = el(
          "span",
          {},
          "Dán, kéo thả hoặc chọn ảnh, tối đa 5 MB",
        );
        const previews = el("div", { class: "previews" });
        let pending = 0;
        const insert = (markdown) => {
          const start = textarea.selectionStart;
          const before = textarea.value.slice(0, start);
          const after = textarea.value.slice(textarea.selectionEnd);
          const lead = before && !before.endsWith("\n") ? "\n" : "";
          const inserted = `${lead}${markdown}\n`;
          textarea.value = before + inserted + after;
          textarea.selectionEnd = textarea.selectionStart =
            before.length + inserted.length;
        };
        const read = (file) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1]);
            reader.onerror = () => reject(new Error("Không đọc được ảnh"));
            reader.readAsDataURL(file);
          });
        const upload = async (file) => {
          if (file.size > maxImageBytes) {
            error.textContent = `${file.name}: ảnh tối đa 5 MB`;
            return;
          }
          pending += 1;
          status.textContent = "Đang tải ảnh…";
          try {
            const image = await call("/api/images", {
              name: file.name,
              data: await read(file),
            });
            insert(image.markdown);
            previews.append(
              el("img", { src: `/api/images/${image.id}`, alt: file.name }),
            );
            error.textContent = "";
          } catch (e) {
            error.textContent = e.message;
          }
          pending -= 1;
          if (!pending) status.textContent = "Đã thêm ảnh vào nội dung";
        };
        const images = (list) =>
          [...list].filter((file) => file.type.startsWith("image/"));
        const uploadAll = (list) => images(list).forEach(upload);
        const input = el("input", {
          type: "file",
          accept: "image/png,image/jpeg,image/gif,image/webp",
          multiple: "",
          onchange: () => {
            uploadAll(input.files);
            input.value = "";
          },
        });
        textarea.addEventListener("paste", (event) => {
          const pasted = images(event.clipboardData?.files ?? []);
          if (!pasted.length) return;
          event.preventDefault();
          pasted.forEach(upload);
        });
        textarea.addEventListener("dragover", (event) =>
          event.preventDefault(),
        );
        textarea.addEventListener("drop", (event) => {
          if (!images(event.dataTransfer?.files ?? []).length) return;
          event.preventDefault();
          uploadAll(event.dataTransfer.files);
        });
        return {
          busy: () => pending > 0,
          node: el(
            "div",
            {},
            el(
              "div",
              { class: "attach" },
              el("label", {}, "Thêm ảnh", input),
              status,
            ),
            previews,
          ),
        };
      }
      const when = (iso) =>
        iso
          ? new Date(iso).toLocaleString("vi-VN", {
              dateStyle: "short",
              timeStyle: "short",
            })
          : "";

      function card(feature, column) {
        const pull = feature.pull;
        return el(
          "div",
          {
            class: "card",
            tabindex: "0",
            onclick: () => openFeature(feature, column),
            onkeydown: (e) => e.key === "Enter" && openFeature(feature, column),
          },
          el("div", { class: "title" }, `#${feature.number} ${feature.title}`),
          el(
            "div",
            { class: "meta" },
            column.gate && feature.stage !== "done"
              ? el("span", { class: "chip gate" }, `Chờ ${column.gate}`)
              : null,
            feature.priority
              ? el("span", { class: "chip" }, feature.priority.toUpperCase())
              : null,
            agentChip(feature),
            pull
              ? el(
                  "span",
                  {},
                  pull.checks
                    ? el("span", { class: `dot ${pull.checks}` })
                    : null,
                  `PR #${pull.number}`,
                )
              : null,
            pull?.preview ? el("span", {}, "có preview") : null,
            el("span", {}, when(feature.updated)),
          ),
        );
      }

      function render() {
        const { data } = state;
        const byColumn = Object.fromEntries(
          data.columns.map((c) => [c.id, []]),
        );
        for (const feature of data.features)
          byColumn[feature.stage]?.push(feature);
        const order = { now: 0, next: 1, later: 2 };
        for (const list of Object.values(byColumn))
          list.sort(
            (a, b) =>
              (order[a.priority] ?? 3) - (order[b.priority] ?? 3) ||
              String(b.updated).localeCompare(String(a.updated)),
          );
        const tabs = el(
          "nav",
          { class: "tabs" },
          data.columns.map((column) =>
            el(
              "button",
              {
                "aria-pressed": String(column.id === state.active),
                onclick: () => {
                  state.active = column.id;
                  render();
                },
              },
              `${column.title} ${byColumn[column.id].length}`,
            ),
          ),
        );
        const board = el(
          "main",
          { class: "board" },
          data.columns.map((column) =>
            el(
              "section",
              { class: `column${column.id === state.active ? " active" : ""}` },
              el(
                "h2",
                {},
                el("span", {}, column.title),
                el("span", {}, byColumn[column.id].length),
              ),
              byColumn[column.id].map((feature) => card(feature, column)),
            ),
          ),
        );
        const header = el(
          "header",
          {},
          el("h1", {}, data.project),
          el("button", { onclick: newIdea }, "+ Ý tưởng"),
          el("button", { onclick: () => load(true), title: "Tải lại" }, "↻"),
        );
        app.replaceChildren(header, tabs, board);
      }

      const buttons = {
        idea: [
          ["approve", "Duyệt G1: lập kế hoạch", "primary"],
          ["revise", "Sửa lại"],
          ["stop", "Dừng", "danger"],
        ],
        plan: [
          ["approve", "Duyệt G2: cho làm", "primary"],
          ["revise", "Sửa lại"],
          ["stop", "Dừng", "danger"],
        ],
        ready: [["stop", "Tạm dừng", "danger"]],
        running: [["stop", "Tạm dừng agent", "danger"]],
        review: [
          ["approve", "Duyệt và merge PR", "primary"],
          ["revise", "Yêu cầu sửa"],
          ["stop", "Dừng", "danger"],
        ],
        blocked: [
          ["approve", "Gỡ chặn, làm tiếp", "primary"],
          ["revise", "Gỡ chặn kèm ghi chú"],
          ["stop", "Dừng", "danger"],
        ],
        done: [],
      };

      const agentStatus = {
        new: "Chưa có phiên",
        running: "Claude đang làm",
        idle: "Claude rảnh",
        "waiting-owner": "Claude chờ bạn",
        "taken-over": "Bạn đang tiếp quản",
        reassigned: "Đã chuyển sang agent khác",
        failed: "Lượt cuối bị lỗi",
      };

      // Named agents: each Claude orchestrator that can take features.
      const namedAgents = () => state.data.agent?.agents ?? [];
      // A feature with no agent waits, unless an unnamed agent takes those.
      const needsAgent = (feature) =>
        namedAgents().length > 0 &&
        !feature.agent &&
        !state.data.agent?.unnamed &&
        feature.stage !== "done";

      // Board warnings are Markdown for the MCP; the page shows plain text.
      const plain = (text) => String(text ?? "").replaceAll("`", "");

      function agentChip(feature) {
        const chips = [];
        // The owner's chat builds it: no orchestrator session to report.
        if (feature.chat) {
          chips.push(
            el(
              "span",
              {
                class: "chip owner-chat",
                title: "Chat của chủ dự án đang làm",
              },
              `Chat: ${feature.chat.name}`,
            ),
          );
          if (feature.chat.stale)
            chips.push(
              el(
                "span",
                {
                  class: "chip agent-request",
                  title: plain(feature.chat.warning),
                },
                `Workpad đứng yên ${feature.chat.idleHours} giờ`,
              ),
            );
          return chips;
        }
        if (feature.agent)
          chips.push(el("span", { class: "chip" }, `Agent: ${feature.agent}`));
        else if (needsAgent(feature))
          chips.push(
            el("span", { class: "chip agent-request" }, "Chưa giao agent"),
          );
        const info = state.data.agent?.features?.[feature.number];
        // Ignore what an agent that lost the feature last said.
        if (info && (info.agent || null) === (feature.agent || null))
          chips.push(
            info.requests
              ? el(
                  "span",
                  { class: "chip agent-request" },
                  "Claude cần bạn duyệt",
                )
              : el(
                  "span",
                  { class: `chip agent-${info.status}` },
                  agentStatus[info.status] ?? info.status,
                ),
          );
        return chips;
      }

      // Pick which agent works on a feature.
      function agentPicker(feature, hasSession, onChange, hint) {
        const agents = namedAgents();
        if (!agents.length) return null;
        const error = el("div", { class: "error" });
        const select = el(
          "select",
          { "aria-label": "Agent" },
          el("option", { value: "" }, "— Chọn agent —"),
          agents.map((a) =>
            el(
              "option",
              { value: a.name },
              `${a.name}${a.online ? "" : " (mất kết nối)"}`,
            ),
          ),
        );
        // A chat is not in the list: show the placeholder.
        select.value = feature.chat ? "" : (feature.agent ?? "");
        const button = el("button", {}, feature.agent ? "Đổi agent" : "Giao");
        button.addEventListener("click", async () => {
          const agent = select.value;
          if (!agent || agent === feature.agent) return;
          if (
            feature.agent &&
            !confirm(
              hasSession()
                ? `Chuyển sang ${agent}? Phiên Claude hiện tại nằm trên máy ${feature.agent}; ${agent} sẽ bắt đầu phiên mới và đọc lại issue cùng Agent Workpad.`
                : `Chuyển feature sang ${agent}?`,
            )
          )
            return;
          button.disabled = true;
          error.textContent = "";
          try {
            await call(`/api/features/${feature.number}/agent`, { agent });
            feature.agent = agent;
            button.textContent = "Đổi agent";
            onChange?.();
            load(true);
          } catch (e) {
            error.textContent = e.message;
          }
          button.disabled = false;
        });
        return el(
          "div",
          { class: "agent-pick" },
          el("span", {}, "Agent:"),
          select,
          button,
          hint,
          error,
        );
      }

      const quote = (path) => `'${String(path).replaceAll("'", "'\\''")}'`;
      // Opens the session in a terminal with Remote Control on, so it can also be
      // followed from claude.ai/code and the Claude app. Sessions the orchestrator
      // runs through the Agent SDK do not start Remote Control themselves.
      const resumeCommand = (s, name) => {
        const claude = `claude --resume ${s.sessionId} --remote-control ${quote(name)}`;
        return s.host === "dokploy"
          ? `docker exec -it <container> sh -lc "cd ${quote(s.workspace)} && ${claude}"`
          : `cd ${quote(s.workspace)} && ${claude}`;
      };

      // Inline Markdown: `code`, **bold**, [text](https://…) and bare https links.
      // Builds DOM nodes, never HTML, so agent text cannot inject markup.
      const inlinePattern =
        /`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\((https:\/\/[^)\s]+)\)|(https:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g;
      function inline(text) {
        const parts = [];
        let last = 0;
        for (const m of text.matchAll(inlinePattern)) {
          parts.push(text.slice(last, m.index));
          if (m[1] !== undefined) parts.push(el("code", {}, m[1]));
          else if (m[2] !== undefined) parts.push(el("strong", {}, m[2]));
          else {
            const href = safeUrl(m[4] ?? m[5]);
            parts.push(
              href
                ? el(
                    "a",
                    { href, target: "_blank", rel: "noopener" },
                    m[3] ?? m[5],
                  )
                : m[0],
            );
          }
          last = m.index + m[0].length;
        }
        parts.push(text.slice(last));
        return parts;
      }

      // The block Markdown an agent writes: paragraphs, headings, bullet and
      // numbered lists, and fenced code.
      function markdown(text) {
        const out = [];
        const lines = String(text).replace(/\r\n/g, "\n").split("\n");
        let paragraph = [];
        let list = null;
        const flush = () => {
          if (paragraph.length) {
            const p = el("p");
            paragraph.forEach((line, i) => {
              if (i) p.append(el("br"));
              p.append(...inline(line));
            });
            out.push(p);
            paragraph = [];
          }
          list = null;
        };
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (/^\s*```/.test(line)) {
            flush();
            const code = [];
            for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++)
              code.push(lines[i]);
            out.push(el("pre", {}, el("code", {}, code.join("\n"))));
            continue;
          }
          const heading = line.match(/^#{1,6}\s+(.*)$/);
          const item = line.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/);
          if (!line.trim()) flush();
          else if (heading) {
            flush();
            out.push(el("h5", {}, ...inline(heading[1])));
          } else if (item) {
            if (paragraph.length) {
              const keep = list;
              flush();
              list = keep;
            }
            const tag = item[1] ? "ul" : "ol";
            if (!list || list.tagName.toLowerCase() !== tag) {
              list = el(tag);
              out.push(list);
            }
            list.append(el("li", {}, ...inline(item[3])));
          } else if (list && /^\s{2,}\S/.test(line))
            list.lastChild.append(" ", ...inline(line.trim()));
          else {
            list = null;
            paragraph.push(line);
          }
        }
        flush();
        return out;
      }

      const sendIcon = () => {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        path.setAttribute("d", "M12 19V5M5 12l7-7 7 7");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "2.2");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
      };

      const outcomeText = {
        allowed: "Bạn đã cho phép",
        denied: "Bạn đã từ chối",
        answered: "Bạn đã trả lời",
        timeout: "Hết giờ chờ bạn",
        cancelled: "Yêu cầu đã huỷ",
      };

      // The feature's Claude session as a chat: the owner on the right, Claude
      // on the left, tool steps folded, questions and approvals above the box.
      function chatPanel(feature) {
        const number = feature.number;
        const path = `/api/features/${number}/chat`;
        let after = 0;
        let timer = null;
        let latest = null;
        let shownRequests = "";
        let shownResume = "";
        let steps = null;
        const answered = new Set();
        const transcript = el(
          "div",
          { class: "transcript", "aria-live": "polite" },
          el(
            "p",
            { class: "empty" },
            "Chưa có trao đổi nào. Nhắn để bắt đầu một phiên Claude cho feature này.",
          ),
        );
        const typing = el(
          "div",
          { class: "typing", "aria-label": "Claude đang làm" },
          el("span"),
          el("span"),
          el("span"),
        );
        const status = el("span", { class: "pill" }, "Đang kết nối…");
        const meta = el("span", { class: "meta" });
        const requests = el("div", { class: "requests" });
        // Lives outside the chat, under it in the feature's popup.
        const takeover = el("div", { class: "takeover", hidden: "" });
        const sessionName = `${state.data.project} #${number}`;
        const error = el("div", { class: "error" });
        const input = el("textarea", {
          rows: "1",
          placeholder: "Nhắn cho Claude…",
          title: "Enter để gửi, Shift+Enter để xuống dòng",
          "aria-label": "Tin nhắn cho Claude",
        });
        const sendButton = el(
          "button",
          {
            class: "send",
            title: "Gửi",
            "aria-label": "Gửi",
            disabled: "",
          },
          sendIcon(),
        );
        const takeButton = el(
          "button",
          { disabled: "" },
          "Ngưng chạy, tự tiếp quản",
        );

        const post = async (suffix, body) => {
          error.textContent = "";
          try {
            await call(`${path}${suffix}`, body);
            refresh();
            return true;
          } catch (e) {
            error.textContent = e.message;
            return false;
          }
        };
        const grow = () => {
          input.style.height = "auto";
          input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
          sendButton.disabled = !input.value.trim();
        };
        const send = async () => {
          const text = input.value.trim();
          if (!text || sendButton.dataset.busy) return;
          sendButton.dataset.busy = "1";
          sendButton.disabled = true;
          if (await post("", { text })) {
            input.value = "";
            transcript.scrollTop = transcript.scrollHeight;
          }
          delete sendButton.dataset.busy;
          grow();
          input.focus();
        };
        input.addEventListener("input", grow);
        input.addEventListener("keydown", (e) => {
          // Vietnamese and other IMEs use Enter to confirm a word.
          if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
          e.preventDefault();
          send();
        });
        sendButton.addEventListener("click", send);
        takeButton.addEventListener("click", () => {
          if (latest?.status === "taken-over") return post("/release", {});
          if (
            confirm(
              "Ngưng lượt Claude đang chạy để bạn tự tiếp tục phiên này trong terminal? Claude sẽ không làm gì cho feature này cho tới khi bạn trả lại.",
            )
          )
            post("/takeover", {});
        });

        function append(node) {
          transcript.querySelector(".empty")?.remove();
          transcript.insertBefore(node, typing.isConnected ? typing : null);
        }

        function entry(event) {
          if (event.kind !== "tool") steps = null;
          if (event.kind === "owner")
            return el(
              "div",
              { class: "bubble", title: when(event.at) },
              event.text,
            );
          if (event.kind === "assistant")
            return el(
              "div",
              { class: "reply", title: when(event.at) },
              el("div", { class: "avatar", "aria-hidden": "true" }, "✳"),
              el("div", { class: "md" }, ...markdown(event.text)),
            );
          if (event.kind === "tool") {
            const row = el("li", {}, el("b", {}, event.name), event.summary);
            if (steps) {
              steps.list.append(row);
              steps.count += 1;
              steps.label.textContent = `${steps.count} bước · ${event.name}`;
              return null;
            }
            const list = el("ol", {}, row);
            const label = el("span", {}, `1 bước · ${event.name}`);
            steps = { list, label, count: 1 };
            return el(
              "details",
              { class: "steps" },
              el("summary", {}, label),
              list,
            );
          }
          if (event.kind === "request-closed")
            return el(
              "div",
              { class: "note" },
              outcomeText[event.outcome] ?? event.outcome,
            );
          if (event.kind === "result")
            return el(
              "div",
              { class: `note${event.ok ? "" : " failed"}` },
              `${event.ok ? "Xong lượt" : "Lượt bị lỗi"} · $${event.costUsd.toFixed(2)}`,
            );
          if (event.kind === "error")
            return el("div", { class: "note failed" }, event.text);
          if (
            event.kind === "status" &&
            ["taken-over", "failed"].includes(event.status)
          )
            return el("div", { class: "note" }, agentStatus[event.status]);
          return null;
        }

        function requestCard(request) {
          const note = el("textarea", {
            rows: "2",
            placeholder: "Ghi chú cho Claude (tuỳ chọn)",
          });
          const done = (body) => {
            answered.add(request.id);
            shownRequests = "";
            post("/answer", { id: request.id, ...body, note: note.value });
          };
          if (request.kind === "approval")
            return el(
              "div",
              { class: "request" },
              el("strong", {}, `Claude xin phép: ${request.reason}`),
              el("pre", {}, request.summary),
              note,
              el(
                "div",
                { class: "actions" },
                el(
                  "button",
                  { class: "primary", onclick: () => done({ allow: true }) },
                  "Cho phép",
                ),
                el(
                  "button",
                  { class: "danger", onclick: () => done({ allow: false }) },
                  "Từ chối",
                ),
              ),
            );
          const picks = (request.questions ?? []).map((q) => {
            const free = el("input", { placeholder: "Hoặc tự trả lời" });
            const chosen = new Set();
            const options = q.options.map((o) => {
              const button = el("button", { title: o.description }, o.label);
              button.addEventListener("click", () => {
                if (!q.multiSelect) chosen.clear();
                chosen.has(o.label)
                  ? chosen.delete(o.label)
                  : chosen.add(o.label);
                for (const b of options)
                  b.setAttribute(
                    "aria-pressed",
                    String(chosen.has(b.textContent)),
                  );
              });
              return button;
            });
            return {
              q,
              value: () => free.value.trim() || [...chosen].join(", "),
              node: el(
                "div",
                { class: "md" },
                el("p", {}, ...inline(q.question)),
                el("div", { class: "actions" }, options),
                free,
              ),
            };
          });
          return el(
            "div",
            { class: "request" },
            el("strong", {}, "Claude hỏi bạn"),
            picks.map((p) => p.node),
            note,
            el(
              "div",
              { class: "actions" },
              el(
                "button",
                {
                  class: "primary",
                  onclick: () =>
                    done({
                      allow: true,
                      answers: Object.fromEntries(
                        picks.map((p) => [p.q.question, p.value()]),
                      ),
                    }),
                },
                "Trả lời",
              ),
              el("button", { onclick: () => done({ allow: false }) }, "Bỏ qua"),
            ),
          );
        }

        function show(view) {
          latest = view.state;
          const s = view.state;
          const pending = (s?.requests ?? []).length;
          const kind = !view.online
            ? "offline"
            : pending
              ? "request"
              : (s?.status ?? "new");
          status.dataset.state = kind;
          status.textContent = !view.online
            ? "Orchestrator mất kết nối"
            : pending
              ? "Claude cần bạn"
              : (agentStatus[s?.status] ?? "Chưa có phiên");
          meta.replaceChildren(
            ...(s
              ? [
                  `${s.turns} lượt`,
                  `$${s.costUsd.toFixed(2)}`,
                  s.agent ? `Agent ${s.agent}` : null,
                  s.host === "dokploy" ? "Dokploy" : "Mac",
                  s.queued ? `${s.queued} tin đang chờ` : null,
                ]
                  .filter(Boolean)
                  .map((t) => el("span", {}, t))
              : []),
          );
          const takenOver = s?.status === "taken-over";
          takeButton.textContent = takenOver
            ? "Trả lại cho Claude"
            : "Ngưng chạy, tự tiếp quản";
          takeButton.className = takenOver ? "primary" : "";
          takeButton.disabled = !s?.sessionId;
          // The command to open this session in a terminal is always shown;
          // it is redrawn only when it changes, so "Đã chép" stays put.
          const canResume = Boolean(s?.sessionId && s.workspace);
          const resumeKey = canResume
            ? `${takenOver}|${resumeCommand(s, sessionName)}`
            : "";
          takeover.hidden = !canResume;
          takeover.classList.toggle("quiet", !takenOver);
          if (canResume && resumeKey !== shownResume)
            takeover.replaceChildren(
              el(
                "div",
                {},
                takenOver
                  ? "Claude đã dừng. Chạy lệnh này trong terminal để tự tiếp tục phiên, rồi bấm “Trả lại cho Claude” khi xong:"
                  : "Mở phiên này trong terminal, có bật Remote Control để theo dõi tiếp trên claude.ai/code hoặc app Claude. Bấm “Ngưng chạy, tự tiếp quản” trước khi mở, để Claude không chạy cùng lúc với bạn:",
              ),
              el("code", {}, resumeCommand(s, sessionName)),
              el(
                "div",
                { class: "actions" },
                el(
                  "button",
                  {
                    onclick: (e) => {
                      navigator.clipboard?.writeText(
                        resumeCommand(s, sessionName),
                      );
                      e.target.textContent = "Đã chép";
                    },
                  },
                  "Chép lệnh",
                ),
              ),
            );
          shownResume = resumeKey;
          // Redraw only when the open requests change, so a half-written
          // answer survives the next refresh.
          const open = (s?.requests ?? []).filter((r) => !answered.has(r.id));
          const key = JSON.stringify([
            open.map((r) => r.id),
            s?.status === "waiting-owner" ? s.question : null,
          ]);
          if (key !== shownRequests) {
            shownRequests = key;
            requests.replaceChildren(
              ...[
                ...open.map(requestCard),
                s?.status === "waiting-owner" && s.question
                  ? el(
                      "div",
                      { class: "request" },
                      el(
                        "strong",
                        {},
                        "Claude đang chờ bạn trả lời trong ô chat",
                      ),
                      el("div", { class: "md" }, ...markdown(s.question)),
                    )
                  : null,
              ].filter(Boolean),
            );
          }
          const stick =
            transcript.scrollTop + transcript.clientHeight >=
            transcript.scrollHeight - 40;
          for (const event of view.events) {
            const node = entry(event);
            if (node) append(node);
          }
          if (view.events.length) after = view.events.at(-1).seq;
          if (s?.status === "running") {
            if (!typing.isConnected) transcript.append(typing);
          } else typing.remove();
          if (stick) transcript.scrollTop = transcript.scrollHeight;
        }

        async function refresh() {
          clearTimeout(timer);
          try {
            show(await call(`${path}?after=${after}`));
          } catch (e) {
            error.textContent = e.message;
          }
          if (node.isConnected) timer = setTimeout(refresh, 2000);
        }

        const hint = el(
          "p",
          { class: "meta agent-hint" },
          "Giao feature cho một agent để Claude bắt đầu làm và nhận tin nhắn.",
        );
        hint.hidden = !needsAgent(feature);
        const node = el(
          "section",
          { class: "convo", "aria-label": "Phiên Claude" },
          el(
            "div",
            { class: "convo-head" },
            el("strong", {}, "Phiên Claude"),
            status,
            meta,
            takeButton,
          ),
          agentPicker(
            feature,
            () => Boolean(latest?.sessionId),
            () => {
              hint.hidden = !needsAgent(feature);
              refresh();
            },
            hint,
          ),
          transcript,
          requests,
          el("div", { class: "composer" }, input, sendButton),
          error,
        );
        return {
          node,
          terminal: takeover,
          start: refresh,
          stop: () => clearTimeout(timer),
        };
      }

      function openFeature(feature, column) {
        const dialog = el("dialog", { class: "feature" });
        const error = el("div", { class: "error" });
        const note = el("textarea", {
          rows: "3",
          placeholder: "Ghi chú cho agent (bắt buộc khi Sửa lại)",
        });
        const notePicker = imagePicker(note, error);
        const workpad = el("div", { class: "body" }, "Đang tải bình luận…");
        const sessions = el("p", { class: "meta" });
        const chat =
          state.data.agent && !feature.chat ? chatPanel(feature) : null;
        const chatHold = feature.chat
          ? el(
              "section",
              { class: "chat-hold", "aria-label": "Chat của chủ dự án" },
              el(
                "p",
                {},
                `Chat của chủ dự án (${feature.chat.name}) đang tự làm feature này qua MCP. Không có phiên orchestrator; tiến độ nằm trong Agent Workpad.`,
              ),
              feature.chat.stale
                ? el("p", { class: "warning" }, plain(feature.chat.warning))
                : null,
              agentPicker(
                feature,
                () => false,
                () => dialog.close(),
                null,
              ),
            )
          : null;
        const pull = feature.pull;
        const act = async (action, label, button) => {
          if (notePicker.busy()) {
            error.textContent = "Đợi ảnh tải xong";
            return;
          }
          if (
            action === "approve" &&
            feature.stage === "review" &&
            !confirm(`Merge PR #${pull?.number ?? "?"} vào nhánh chính?`)
          )
            return;
          button.disabled = true;
          error.textContent = "";
          try {
            await call(`/api/features/${feature.number}/actions`, {
              action,
              note: note.value,
            });
            dialog.close();
            load(true);
          } catch (e) {
            error.textContent = e.message;
            button.disabled = false;
          }
        };
        const actionButtons = (buttons[feature.stage] ?? []).map(
          ([action, label, kind]) => {
            const button = el("button", { class: kind ?? "" }, label);
            button.addEventListener("click", () => act(action, label, button));
            return button;
          },
        );
        dialog.append(
          el(
            "div",
            { class: "sheet" },
            el("h3", {}, `#${feature.number} ${feature.title}`),
            el(
              "div",
              { class: "meta" },
              el("span", { class: "chip" }, column.title),
              ...feature.labels.map((label) =>
                el("span", { class: "chip" }, label),
              ),
              el(
                "a",
                {
                  href: safeUrl(feature.url),
                  target: "_blank",
                  rel: "noopener",
                },
                "Mở trên GitHub",
              ),
            ),
            pull
              ? el(
                  "p",
                  { class: "meta" },
                  el(
                    "a",
                    {
                      href: safeUrl(pull.url),
                      target: "_blank",
                      rel: "noopener",
                    },
                    `PR #${pull.number}`,
                  ),
                  pull.state === "merged"
                    ? "đã merge"
                    : pull.draft
                      ? "nháp"
                      : null,
                  pull.checks
                    ? el(
                        "span",
                        {},
                        el("span", { class: `dot ${pull.checks}` }),
                        checkText[pull.checks] ?? pull.checks,
                      )
                    : null,
                  safeUrl(pull.preview)
                    ? el(
                        "a",
                        {
                          href: safeUrl(pull.preview),
                          target: "_blank",
                          rel: "noopener",
                        },
                        "Xem preview",
                      )
                    : null,
                )
              : null,
            el("h4", {}, "Mô tả và kế hoạch"),
            el("div", { class: "body" }, withImages(feature.body || "(trống)")),
            el("h4", {}, "Agent Workpad"),
            workpad,
            sessions,
            chat?.node,
            chat?.terminal,
            chatHold,
            actionButtons.length ? el("h4", {}, "Quyết định") : null,
            actionButtons.length ? note : null,
            actionButtons.length ? notePicker.node : null,
            el(
              "div",
              { class: "actions" },
              actionButtons,
              el("button", { onclick: () => dialog.close() }, "Đóng"),
            ),
            error,
          ),
        );
        dialog.addEventListener("close", () => {
          chat?.stop();
          dialog.remove();
        });
        document.body.append(dialog);
        dialog.showModal();
        chat?.start();
        call(`/api/features/${feature.number}/comments`)
          .then((comments) => {
            const pad = comments.filter((c) => c.workpad).pop();
            workpad.replaceChildren(
              ...withImages(pad ? pad.body : "(agent chưa ghi workpad)"),
            );
            const runs = comments.flatMap((c) =>
              [...c.body.matchAll(/#session\/(\d+)/g)].map((m) => m[1]),
            );
            sessions.replaceChildren(
              ...[...new Set(runs)].map((run, index) =>
                el(
                  "a",
                  {
                    href: `#session/${run}`,
                    target: "_blank",
                    rel: "noopener",
                  },
                  `Phiên Claude ${index + 1}`,
                ),
              ),
            );
          })
          .catch((e) => (workpad.textContent = e.message));
      }

      function newIdea() {
        const dialog = el("dialog");
        const title = el("input", {
          placeholder: "Tên ý tưởng",
          maxlength: "200",
        });
        const body = el("textarea", {
          rows: "6",
          placeholder: "Mô tả ngắn: vấn đề, ai dùng, kết quả mong muốn",
        });
        const error = el("div", { class: "error" });
        const picker = imagePicker(body, error);
        const save = el("button", { class: "primary" }, "Tạo");
        save.addEventListener("click", async () => {
          if (picker.busy()) {
            error.textContent = "Đợi ảnh tải xong";
            return;
          }
          save.disabled = true;
          try {
            await call("/api/features", {
              title: title.value,
              body: body.value,
            });
            dialog.close();
            load(true);
          } catch (e) {
            error.textContent = e.message;
            save.disabled = false;
          }
        });
        dialog.append(
          el(
            "div",
            { class: "sheet" },
            el("h3", {}, "Ý tưởng mới"),
            title,
            el("p"),
            body,
            picker.node,
            el(
              "div",
              { class: "actions" },
              save,
              el("button", { onclick: () => dialog.close() }, "Huỷ"),
            ),
            error,
          ),
        );
        dialog.addEventListener("close", () => dialog.remove());
        document.body.append(dialog);
        dialog.showModal();
        title.focus();
      }

      async function load(fresh = false) {
        try {
          state.data = await call(`/api/board${fresh ? "?fresh=1" : ""}`);
          document.title = `Board · ${state.data.project}`;
          render();
        } catch (e) {
          if (e.message !== "Cần đăng nhập")
            app.replaceChildren(
              el("p", { class: "error", style: "padding:16px" }, e.message),
            );
        }
      }

      function sessionEntry(entry) {
        if (entry.kind === "user" || entry.kind === "assistant")
          return el(
            "section",
            { class: `message ${entry.kind}` },
            el(
              "div",
              { class: "meta" },
              el("strong", {}, entry.kind === "user" ? "Yêu cầu" : "Claude"),
              when(entry.at),
            ),
            el("div", { class: "text" }, entry.text),
          );
        if (entry.kind === "thinking")
          return el(
            "details",
            { class: "step" },
            el("summary", {}, "Suy nghĩ"),
            el("div", { class: "text" }, entry.text),
          );
        return el(
          "details",
          { class: `step${entry.error ? " failed" : ""}` },
          el(
            "summary",
            {},
            el("strong", {}, entry.name || "Kết quả"),
            ` ${entry.summary}`,
          ),
          entry.input ? el("pre", {}, entry.input) : null,
          el("pre", {}, entry.result ?? "(không có kết quả)"),
        );
      }

      async function showSession(run) {
        app.replaceChildren(el("p", { style: "padding:16px" }, "Đang tải…"));
        try {
          const session = await call(`/api/sessions/${run}`);
          document.title = `Phiên Claude · ${session.project}`;
          app.replaceChildren(
            el(
              "header",
              {},
              el("a", { href: "#" }, "← Board"),
              el("h1", {}, `Phiên Claude · ${session.project}`),
              el(
                "a",
                {
                  href: safeUrl(
                    `https://github.com/${session.repo}/actions/runs/${run}`,
                  ),
                  target: "_blank",
                  rel: "noopener",
                },
                "Lần chạy",
              ),
            ),
            el(
              "main",
              { class: "session" },
              session.entries.length
                ? session.entries.map(sessionEntry)
                : "(phiên trống)",
            ),
          );
        } catch (e) {
          if (e.message !== "Cần đăng nhập")
            app.replaceChildren(
              el(
                "div",
                { style: "padding:16px" },
                el("p", { class: "error" }, e.message),
                el("a", { href: "#" }, "← Board"),
              ),
            );
        }
      }

      const sessionRun = () => location.hash.match(/^#session\/(\d+)$/)?.[1];

      function start() {
        const run = sessionRun();
        if (run) showSession(run);
        else load();
      }

      window.addEventListener("hashchange", start);
      start();
      setInterval(
        () =>
          document.visibilityState === "visible" &&
          state.data &&
          !sessionRun() &&
          load(),
        60_000,
      );
    </script>
  </body>
</html>
