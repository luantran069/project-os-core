# Project OS project manifest. Checked by project-os-core/scripts/check-project.mjs.
core:
  repository: luantran069/project-os-core
  version: __CORE_VERSION__

project:
  name: __PROJECT_NAME__
  repository: __REPO__
  owner: __OWNER__
  created: __DATE__

# Features live in GitHub Issues; the board and Symphony both read them.
tracker:
  kind: github
  repo: __REPO__

runtime:
  orchestrator: symphony
  agent: codex
  max_concurrent_agents: 1
  max_turns: 8
  # Checked against WORKFLOW.md by .project-os/symphony/check.mjs.
  setup_command: npm ci # must appear in the after_create hook
  verify_command: null # e.g. npm run verify; must appear in the agent prompt

# Label names on the tracker. Defaults match good-ideas.
labels:
  idea: symphony-idea
  plan: symphony-plan
  ready: symphony-ready
  blocked: symphony-blocked
  in_progress: symphony-in-progress
  human_review: symphony-human-review
  pilot_review: symphony-pilot-review
  ai_review: symphony-ai-review

# Autonomy: L0 suggest, L1 ask first, L2 act then report, L3 automatic.
modules:
  assess: { enabled: false, autonomy: L0 }
  build: { enabled: true, autonomy: L1 }
  deploy: { enabled: false, autonomy: L1 }
  marketing: { enabled: false, autonomy: L0 }
  analytics: { enabled: false, autonomy: L0 }

gates:
  release: required # required | auto
  public_content: required # always required
  merge: owner # owner | ai: who decides a pull request in review

# Used when gates.merge is ai. A PR touching owner_paths always goes to the owner.
review:
  max_rounds: 2 # times the AI reviewer may send a PR back before the owner decides
  owner_paths:
    - ".github/**"
    - ".project-os/**"
    - "project.yaml"
    - "WORKFLOW.md"
    - "**/migrations/**"
    - "**/package.json"
    - "**/package-lock.json"
    - "**/go.mod"
    - "**/go.sum"
    - "**/*.gradle*"
    - "**/Dockerfile"
    - ".env*"

budget:
  monthly_usd: null # set before raising concurrency
